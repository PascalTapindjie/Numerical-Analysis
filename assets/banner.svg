<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Numerical Analysis — animated banner by Pascal Tapindjie">
  <title>Numerical Analysis — Pascal Tapindjie</title>
  <defs>
    <!-- ===== Fonds & lumières ===== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="55%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#2b1550"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <clipPath id="card">
      <rect x="4" y="4" width="992" height="332" rx="26"/>
    </clipPath>

    <!-- Machine à écrire : révélation du nom de l'auteur -->
    <clipPath id="typeClip">
      <rect x="350" y="224" width="0" height="46">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.9;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Masque : ne laisse passer le reflet que sur les lettres du titre -->
    <mask id="titleMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="340">
      <text x="500" y="112" text-anchor="middle" font-size="62" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#ffffff">Numerical Analysis</text>
    </mask>

    <filter id="glowSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glowText" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ===== Carte ===== -->
  <rect x="4" y="4" width="992" height="332" rx="26" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <!-- Halos mouvants (jeu de lumière) -->
    <circle cx="200" cy="80" r="140" fill="#2563eb" opacity="0.35" filter="url(#glowSoft)">
      <animate attributeName="cx" values="200;340;200" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.5;0.28" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="255" r="150" fill="#c026d3" opacity="0.3" filter="url(#glowSoft)">
      <animate attributeName="cx" values="810;680;810" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="255;190;255" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Faisceaux lumineux balayant la carte -->
    <rect x="-460" y="-60" width="180" height="460" fill="url(#beamGrad)" opacity="0.45" transform="skewX(-22)">
      <animate attributeName="x" values="-460;1260" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="-460" y="-60" width="120" height="460" fill="url(#beamGrad)" opacity="0.3" transform="skewX(-22)">
      <animate attributeName="x" values="-460;1260" dur="10s" begin="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Étoiles scintillantes -->
    <circle cx="70" cy="52" r="2.5" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="255" r="2" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="180" r="1.8" fill="#fde68a">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.7s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="300" r="2.2" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="46" r="2" fill="#f0abfc">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="585" cy="58" r="1.8" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="44" r="2.4" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="895" cy="95" r="2" fill="#fde68a">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="945" cy="205" r="2.6" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="3.1s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="300" r="1.9" fill="#f0abfc">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="285" r="1.7" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="655" cy="312" r="2.1" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== Titre du projet : halo pulsé ===== -->
  <text x="500" y="112" text-anchor="middle" font-size="62" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#818cf8" filter="url(#glowText)">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.5s" repeatCount="indefinite"/>
    Numerical Analysis
  </text>

  <!-- ===== Titre du projet : dégradé ===== -->
  <text x="500" y="112" text-anchor="middle" font-size="62" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="url(#titleGrad)">Numerical Analysis</text>

  <!-- ===== Titre du projet : reflet lumineux balayant les lettres ===== -->
  <g mask="url(#titleMask)">
    <rect x="-320" y="60" width="240" height="90" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-320;1120" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== Soulignement qui respire ===== -->
  <rect x="330" y="142" width="340" height="4" rx="2" fill="url(#borderGrad)">
    <animate attributeName="width" values="340;430;340" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="330;285;330" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Sous-titre ===== -->
  <text x="500" y="182" text-anchor="middle" font-size="22" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#a5b4fc" letter-spacing="1.5">TP1 · TD2 — Python · NumPy · Matplotlib</text>

  <!-- ===== Nom de l'auteur : effet machine à écrire ===== -->
  <g clip-path="url(#typeClip)">
    <text x="350" y="252" font-size="30" font-weight="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#e2e8f0" textLength="300" lengthAdjust="spacing">Pascal Tapindjie</text>
  </g>

  <!-- Curseur qui suit l'écriture et pulse -->
  <rect x="350" y="230" width="4" height="30" rx="1" fill="#7dd3fc">
    <animate attributeName="x" values="350;650;650;350" keyTimes="0;0.4;0.9;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Lien ===== -->
  <text x="500" y="300" text-anchor="middle" font-size="16" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#8b9bc4">github.com/PascalTapindjie</text>

  <!-- ===== Bordure statique ===== -->
  <rect x="5" y="5" width="990" height="330" rx="25" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.55"/>

  <!-- ===== Bordure : comète lumineuse en orbite ===== -->
  <rect x="5" y="5" width="990" height="330" rx="25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="150 2447" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="2597;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
