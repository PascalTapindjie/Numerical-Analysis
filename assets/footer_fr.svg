    <animate attributeName="opacity" values=".55;1;.55" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="162" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#64748b">Pascal Tapindjie · Python · NumPy · Matplotlib · Tkinter</text>
