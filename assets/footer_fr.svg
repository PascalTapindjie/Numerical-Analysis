<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <text x="600" y="80" text-anchor="middle" font-family="'Segoe UI', Verdana, Geneva, sans-serif" font-size="40" font-weight="700" fill="url(#fg)">Merci de votre visite !</text>
  <rect x="380" y="40" width="260" height="52" fill="url(#shine)" transform="skewX(-18)">
    <animate attributeName="x" values="-450;1450" dur="4s" begin="0s" repeatCount="indefinite"/>
  </rect>
